<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Comfy Infinity</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0d12;
        color: #d7dbe3;
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        user-select: none;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 18px;
        border: 2px solid rgba(215, 219, 227, 0.18);
        border-top-color: #d7dbe3;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      .title {
        font-size: 15px;
        letter-spacing: 0.02em;
      }
      .hint {
        margin-top: 8px;
        font-size: 12px;
        color: #6f7683;
      }
      @media (prefers-color-scheme: light) {
        body {
          background: #f6f4f0;
          color: #211d19;
        }
        .spinner {
          border-color: rgba(33, 29, 25, 0.18);
          border-top-color: #211d19;
        }
        .hint {
          color: #877f73;
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div class="title">正在启动本地服务…</div>
      <div class="hint">检测并拉起 ComfyUI 与网关，稍后自动进入控制台</div>
    </div>
  </body>
</html>
