<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/admin/logo.png" />
    <title>模型配置</title>
    <script>
      (function () {
        try {
          var key = "comfy-infinity-gateway-theme";
          var theme = localStorage.getItem(key);
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          /* 首屏主题失败不影响页面 */
        }
      })();
    </script>
    <script type="module" crossorigin src="/admin/assets/index-Du2lS7Ga.js"></script>
    <link rel="stylesheet" crossorigin href="/admin/assets/index-IJjJKe_a.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
